# ==============================================================================
# SyncTone Production Docker Compose Configuration
# Features: Hardened Localhost Bindings, Shared ONNX Volumes, Automatic SSL/TLS
# ==============================================================================

services:
  # ==============================================================================
  # 1. PostgreSQL 16 — Relational Core & ACID Authority
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: synctone-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synctone_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-synctone_production_secure_pass_2026}"
      POSTGRES_DB: ${POSTGRES_DB:-synctone}
    ports:
      # Bound strictly to 127.0.0.1 on the host to avoid accidental public exposure
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./migrations/0001_initial_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    networks:
      - synctone-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synctone_user} -d ${POSTGRES_DB:-synctone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. MongoDB 7.0 — Document Store for Raw Chapters & Audio Timelines
  # ==============================================================================
  mongo:
    image: mongo:7.0
    container_name: synctone-prod-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-synctone_user}
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:-synctone_production_secure_pass_2026}"
      MONGO_INITDB_DATABASE: ${MONGO_DB:-synctone}
    ports:
      # Bound strictly to 127.0.0.1
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - synctone-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' localhost:27017/test --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 3. OpenStack Swift — Distributed Object Storage
  # ==============================================================================
  swift:
    image: bouncestorage/swift-aio:latest
    container_name: synctone-prod-swift
    restart: always
    ports:
      # Bound strictly to 127.0.0.1
      - "127.0.0.1:${SWIFT_PORT:-8080}:8080"
    volumes:
      - swift_data:/srv/node
    networks:
      - synctone-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 4. Model Cache Downloader (Pre-populates Kokoro & Paradee ONNX weights)
  # ==============================================================================
  model-init:
    image: curlimages/curl:8.5.0
    container_name: synctone-prod-model-init
    volumes:
      - models_cache:/models
      - ./scripts/download-models.sh:/scripts/download-models.sh:ro
    user: root
    entrypoint: ["sh", "-c", "apk add --no-cache bash && bash /scripts/download-models.sh /models"]
    networks:
      - synctone-net

  # ==============================================================================
  # 5. Express.js REST API & Swift Streaming Proxy
  # ==============================================================================
  api:
    build:
      context: ./novel-audio-synthesizer/backend
      dockerfile: Dockerfile
    container_name: synctone-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      swift:
        condition: service_started
      model-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: "${JWT_SECRET:-synctone_production_jwt_secret_token_key_2026}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${POSTGRES_USER:-synctone_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synctone}
      MONGO_URI: mongodb://${MONGO_USER:-synctone_user}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-synctone}?authSource=admin
      SWIFT_AUTH_URL: http://swift:8080/auth/v1.0
      SWIFT_USERNAME: ${SWIFT_USERNAME:-test:tester}
      SWIFT_KEY: ${SWIFT_KEY:-testing}
      SWIFT_CONTAINER_AUDIO: ${SWIFT_CONTAINER_AUDIO:-novel-chapters}
      SWIFT_CONTAINER_COVERS: ${SWIFT_CONTAINER_COVERS:-novel-covers}
      PYTHON_BIN: /opt/venv/bin/python3
      KOKORO_MODEL_PATH: /app/kokoro-tts-backend/models_cache/kokoro-v1.0.onnx
      KOKORO_VOICES_PATH: /app/kokoro-tts-backend/models_cache/voices-v1.0.bin
      PARADEE_MODEL_PATH: /app/kokoro-tts-backend/models_cache/paradee-v1.2-int8.onnx
      PARADEE_VOICES_PATH: /app/kokoro-tts-backend/models_cache/paradee-voices.json
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UNLIMITED_OCR_URL: ${UNLIMITED_OCR_URL:-}
    volumes:
      - shared_output:/app/output
      - covers_data:/app/output/covers
      - chapters_data:/app/chapters
      - app_data:/app/data
      - models_cache:/app/kokoro-tts-backend/models_cache
      - models_cache:/app/models_cache
    networks:
      - synctone-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 6. Python Worker Daemon — NLP & Kokoro-ONNX TTS
  # ==============================================================================
  worker:
    build:
      context: ./novel-audio-synthesizer/kokoro-tts-backend
      dockerfile: Dockerfile
    container_name: synctone-prod-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      swift:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synctone_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synctone}
      MONGO_URI: mongodb://${MONGO_USER:-synctone_user}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-synctone}?authSource=admin
      SWIFT_AUTH_URL: http://swift:8080/auth/v1.0
      SWIFT_USERNAME: ${SWIFT_USERNAME:-test:tester}
      SWIFT_KEY: ${SWIFT_KEY:-testing}
      SWIFT_CONTAINER_AUDIO: ${SWIFT_CONTAINER_AUDIO:-novel-chapters}
      WORKER_ID: ${WORKER_ID:-synctone-worker-1}
      WORKER_POLL_INTERVAL_SEC: ${WORKER_POLL_INTERVAL_SEC:-3}
      KOKORO_MODEL_PATH: /app/models_cache/kokoro-v1.0.onnx
      KOKORO_VOICES_PATH: /app/models_cache/voices-v1.0.bin
      PARADEE_MODEL_PATH: /app/models_cache/paradee-v1.2-int8.onnx
      PARADEE_VOICES_PATH: /app/models_cache/paradee-voices.json
    volumes:
      - shared_output:/app/output
      - pcm_cache:/app/output/pcm_cache
      - covers_data:/app/output/covers
      - chapters_data:/app/chapters
      - app_data:/app/data
      - models_cache:/app/models_cache
      - models_cache:/app/kokoro-tts-backend/models_cache
    networks:
      - synctone-net

  # ==============================================================================
  # 7. React 18 + Vite Frontend Web App (Internal Port 80)
  # ==============================================================================
  frontend:
    build:
      context: ./novel-audio-synthesizer/frontend
      dockerfile: Dockerfile
    container_name: synctone-prod-frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - synctone-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==============================================================================
  # 8. Caddy Reverse Proxy & Automatic Let's Encrypt HTTPS Gateway
  # ==============================================================================
  caddy:
    image: caddy:2.7-alpine
    container_name: synctone-prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - synctone-net

  # ==============================================================================
  # 9. One-Shot Demo Seeder (Populates reference portfolio on initial deployment)
  # ==============================================================================
  seed-demos:
    build:
      context: ./novel-audio-synthesizer/backend
      dockerfile: Dockerfile
    container_name: synctone-prod-seeder
    profiles:
      - seed
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-synctone_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-synctone}
      MONGO_URI: mongodb://${MONGO_USER:-synctone_user}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-synctone}?authSource=admin
    volumes:
      - shared_output:/app/output
      - covers_data:/app/output/covers
      - models_cache:/app/kokoro-tts-backend/models_cache
      - models_cache:/app/models_cache
    entrypoint: ["node", "src/scripts/seedDemos.js"]
    networks:
      - synctone-net

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  swift_data:
    driver: local
  pcm_cache:
    driver: local
  shared_output:
    driver: local
  covers_data:
    driver: local
  chapters_data:
    driver: local
  app_data:
    driver: local
  models_cache:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  synctone-net:
    driver: bridge
