<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncTone — Cinematic Multi-Voice Webnovel & Audiobook Platform</title>

    <!-- Flash-of-Wrong-Theme Prevention -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('synctone_theme') || 'dark';
          if (saved !== 'dark' && saved !== 'light') saved = 'dark';
          document.documentElement.className = saved;
        } catch (e) {
          document.documentElement.className = 'dark';
        }
      })();
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (UI), Literata (Prose/Titles), JetBrains Mono (Code/Metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen font-sans antialiased selection:bg-amber-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
