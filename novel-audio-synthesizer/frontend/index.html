<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0D" id="meta-theme-color" />
    <title>SyncTone — Cinematic Multi-Voice Webnovel & Audiobook Platform</title>

    <!-- Flash-of-Wrong-Theme Prevention -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('synctone_theme') || 'dark';
          if (saved !== 'dark' && saved !== 'light') saved = 'dark';
          document.documentElement.className = saved;
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', saved === 'dark' ? '#0B0B0D' : '#EFEFF0');
        } catch (e) {
          document.documentElement.className = 'dark';
        }
      })();
    </script>

    <!-- Clean Rogue Dev Service Worker & Stale Caches on Localhost -->
    <script>
      if (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
      }
    </script>

    <!-- Google Fonts: JetBrains Mono (Code/Metadata) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen font-sans antialiased selection:bg-[var(--accent)] selection:text-[var(--on-accent)]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
